<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CatWeb Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>🐱 CatWeb Generator</h1>
      <p>
        Your deployment is working. This repository contains a Python generator
        that scaffolds static CatWeb projects.
      </p>
      <pre><code>python3 catweb_generator.py my-catweb</code></pre>
      <p>Then deploy the generated folder contents (index.html, styles.css, app.js).</p>
      <button id="factButton">Show Cat Fact</button>
      <blockquote id="fact" class="fact">Cats sleep 12–16 hours a day.</blockquote>
    </main>
    <script src="app.js"></script>
  </body>
</html>
